<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BUNDLE:START-->
<title>My Boston, So Far</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><!--LEAFLET_CSS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: map-first. A paper side panel lists places in the order found; tapping a pin opens a postcard. */
  :root {
    --water: #b8cfd9; --land: #eef0ec; --hood: #cfd6d3; --visited: #a8432f1a;
    --ink: #1d2a31; --muted: #5d6b71; --line: #d6dcda; --paper: #fbfaf7;
    --brick: #a8432f; --on-brick: #fff8f3;
    --display: "Young Serif", Georgia, serif;
    --body: Figtree, system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --water: #0f1c22; --land: #1c2529; --hood: #2d393e; --visited: #e07a5f22;
      --ink: #e8eef0; --muted: #98a6ab; --line: #2b363b; --paper: #20292d;
      --brick: #e07a5f; --on-brick: #1a1210; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --water: #0f1c22; --land: #1c2529; --hood: #2d393e; --visited: #e07a5f22;
    --ink: #e8eef0; --muted: #98a6ab; --line: #2b363b; --paper: #20292d;
    --brick: #e07a5f; --on-brick: #1a1210; color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body);
         display: grid; grid-template-columns: 340px minmax(0, 1fr); overflow: hidden; }

  /* ---------- side panel ---------- */
  .panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--paper); }
  .intro { padding: 24px 22px 18px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
  .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--brick); }
  h1 { font: 400 32px/1.05 var(--display); margin: 0; text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); max-width: 32ch; }
  .stats { display: flex; gap: 22px; }
  .stat b { display: block; font: 400 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .stat span { font: 500 10.5px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sample { font: 500 11px var(--mono); color: var(--brick); }

  .list-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .list-head { padding: 14px 22px 8px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .list { overflow-y: auto; padding: 0 10px 16px; display: grid; gap: 2px; align-content: start; }
  .row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px;
         align-items: center; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
  .row:hover, .row[aria-current="true"] { background: var(--visited); }
  .row:focus-visible { outline: 2px solid var(--brick); outline-offset: -2px; }
  .row[hidden] { display: none; }
  .row .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brick); color: var(--on-brick);
            display: grid; place-items: center; font: 500 12px var(--mono); }
  .row .t { min-width: 0; }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 13px; color: var(--muted); }
  .row .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--line); }

  /* ---------- map ---------- */
  .stage { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: var(--water); }
  .leaflet-container { font: inherit; background: var(--water); }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--paper) 80%, transparent) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .leaflet-bar a { background: var(--paper); color: var(--ink); border-color: var(--line); }
  .leaflet-bar a:hover { background: var(--land); }
  .lbl { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
         white-space: nowrap; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; }
  .lbl.water { font: italic 400 13px/1 var(--display); text-transform: none; letter-spacing: .02em; opacity: .7; }
  .lbl.town { font-size: 11px; letter-spacing: .14em; opacity: .6; }
  .pin { width: 28px; height: 28px; border-radius: 50%; background: var(--brick); color: var(--on-brick);
         border: 2px solid var(--paper); box-shadow: 0 1px 4px #0004; display: grid; place-items: center;
         font: 500 12px var(--mono); transform: translate(-50%, -50%); transition: transform .2s; cursor: pointer; }
  .pin.on { transform: translate(-50%, -50%) scale(1.25); }
  .pin.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(0); } }

  .timeline { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1000; display: flex; align-items: center; gap: 12px;
              background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 6px;
              box-shadow: 0 4px 18px #0002; max-width: 560px; margin-inline: auto; }
  .timeline button { all: unset; cursor: pointer; background: var(--brick); color: var(--on-brick); border-radius: 999px;
                     padding: 7px 14px; font: 600 13px var(--body); white-space: nowrap; }
  .timeline button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .timeline input { flex: 1; min-width: 0; accent-color: var(--brick); }
  .timeline output { font: 500 12px var(--mono); color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- postcard ---------- */
  .card { position: absolute; z-index: 1001; top: 16px; right: 16px; width: min(340px, calc(100% - 32px));
          background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
          box-shadow: 0 10px 40px #0003; }
  .card .photo { position: relative; aspect-ratio: 4 / 3; background: var(--land); max-width: 100%; }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .photo .nav { position: absolute; inset: auto 8px 8px auto; display: flex; gap: 6px; }
  .card .photo .nav button { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
                             background: #000a; color: #fff; font-size: 16px; }
  .card .photo .count { position: absolute; left: 10px; bottom: 10px; font: 500 11px var(--mono); color: #fff; background: #000a;
                        border-radius: 99px; padding: 3px 8px; }
  .card .nophoto { display: grid; place-items: center; color: var(--muted); font: 500 12px var(--mono); }
  .card .body { padding: 16px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; }
  .card h2 { font: 400 22px/1.15 var(--display); margin: 0; text-wrap: balance; }
  .card .where { color: var(--muted); font-size: 13.5px; grid-column: 1; }
  .card .facts { grid-column: 1 / -1; margin-top: 8px; font-size: 13.5px; }
  .postmark { grid-row: 1 / span 2; grid-column: 2; width: 70px; height: 70px; border-radius: 50%; border: 1.5px solid var(--brick);
              color: var(--brick); display: grid; place-items: center; text-align: center; transform: rotate(-12deg);
              font: 500 9.5px/1.25 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
  .postmark b { display: block; font-size: 13px; letter-spacing: .02em; }
  .close { all: unset; position: absolute; top: 8px; right: 8px; z-index: 2; cursor: pointer; width: 30px; height: 30px; border-radius: 50%;
           display: grid; place-items: center; background: #000a; color: #fff; font-size: 18px; line-height: 1; }
  .close:focus-visible, .card .nav button:focus-visible { outline: 2px solid #fff; }

  @media (max-width: 760px) {
    html, body { height: auto; }
    body { grid-template-columns: minmax(0, 1fr); overflow-x: hidden; overflow-y: auto; }
    .panel { display: contents; }
    .intro { padding: 18px 16px 14px; order: 1; }
    h1 { font-size: 27px; }
    .stage { order: 2; display: flex; flex-direction: column; }
    #map { position: relative; inset: auto; height: 60vh; }
    .list-wrap { order: 3; border-top: 1px solid var(--line); }
    .list-head { padding: 14px 16px 6px; }
    .list { padding: 0 6px 24px; overflow: visible; }
    .card { top: 10px; right: 10px; left: 10px; width: auto; max-height: calc(60vh - 60px); overflow-y: auto; }
    .card .photo { aspect-ratio: 16 / 9; }
    .card .body { padding: 12px 14px 14px; }
    .card h2 { font-size: 19px; }
    .postmark { width: 58px; height: 58px; font-size: 8.5px; }
    .postmark b { font-size: 11px; }
    .timeline { position: static; margin: 10px 12px 0; box-shadow: none; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { .pin, .pin.pop { animation: none; transition: none; } }
</style>
<!--BUNDLE:HEAD_END-->
</head>
<body>
<aside class="panel">
  <div class="intro">
    <div class="eyebrow">Postcards from BU</div>
    <h1 id="title">My Boston, So Far</h1>
    <p class="lede">Every place I've photographed since I landed in Boston. Tap a pin to see it.</p>
    <div class="stats">
      <div class="stat"><b id="sPlaces">–</b><span>places</span></div>
      <div class="stat"><b id="sAreas">–</b><span>neighborhoods</span></div>
      <div class="stat"><b id="sSince">–</b><span>first photo</span></div>
    </div>
    <div class="sample" id="sample" hidden>Showing sample data</div>
  </div>
  <div class="list-wrap">
    <div class="list-head">In the order I found them</div>
    <div class="list" id="list"></div>
  </div>
</aside>

<main class="stage">
  <div id="map" aria-label="Map of places in Boston"></div>
  <article class="card" id="card" hidden aria-live="polite"></article>
  <div class="timeline">
    <button id="play" type="button">▶ Replay</button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Show places found up to this date">
    <output id="when"></output>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(async function () {
  const DAY = 864e5;
  // 'YYYY-MM-DD…' → local midnight, so dates never shift with the viewer's timezone
  const day = s => { const [y, m, d] = String(s).slice(0, 10).split('-'); return new Date(+y, m - 1, +d).getTime(); };
  const fmt = (t, o = { month: 'short', day: 'numeric' }) => new Date(typeof t === 'number' ? t : day(t)).toLocaleDateString('en-US', o);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const DATA = window.__DATA__ || await fetch('data.json').then(r => r.ok ? r : fetch('data.public.json')).then(r => r.json());
  const BASE = window.__BASEMAP__ || await fetch('basemap.json').then(r => r.json());
  const { meta, places } = DATA;

  // ---------- header
  document.getElementById('title').textContent = meta.title;
  document.getElementById('sample').hidden = !meta.sample;
  document.getElementById('sAreas').textContent = new Set(places.map(p => p.area)).size;
  document.getElementById('sSince').textContent = meta.from ? fmt(meta.from) : '–';

  // ---------- map
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: 0.25, minZoom: 11, maxZoom: 17,
    maxBounds: [[42.20, -71.25], [42.47, -70.85]] });
  map.attributionControl.setPrefix(false).addAttribution(BASE.attribution);

  const visitedAreas = new Set(places.map(p => p.area));
  const landLayer = L.geoJSON(BASE.land, { interactive: false, style: () => ({ stroke: false, fillColor: css('--land'), fillOpacity: 1 }) }).addTo(map);
  const hoodLayer = L.geoJSON({ type: 'FeatureCollection', features: BASE.neighborhoods.map(n => ({ type: 'Feature', properties: { name: n.name }, geometry: n.geometry })) }, {
    interactive: false,
    style: f => ({ color: css('--hood'), weight: 1, fill: true, fillColor: css('--brick'),
                   fillOpacity: visitedAreas.has(f.properties.name) ? 0.08 : 0 })
  }).addTo(map);
  const restyle = () => {
    landLayer.setStyle({ fillColor: css('--land') });
    hoodLayer.setStyle(() => ({ color: css('--hood'), fillColor: css('--brick') }));
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  const label = (lat, lon, text, cls) => L.marker([lat, lon], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: '', html: `<div class="lbl ${cls}">${esc(text)}</div>`, iconSize: [0, 0] }) });
  const hoodLabels = L.layerGroup(BASE.neighborhoods.map(n => label(n.label[0], n.label[1], n.name, 'hood')));
  BASE.labels.forEach(l => label(l.lat, l.lon, l.text, l.kind).addTo(map));
  const syncLabels = () => map.getZoom() >= 13.5 ? hoodLabels.addTo(map) : hoodLabels.remove();
  map.on('zoomend', syncLabels);

  // ---------- pins + list
  const list = document.getElementById('list');
  const card = document.getElementById('card');
  let active = null;

  const items = places.map((p, i) => {
    const n = i + 1;
    const el = document.createElement('div');
    el.className = 'pin'; el.textContent = n;
    const marker = L.marker([p.lat, p.lon], { title: p.name, riseOnHover: true,
      icon: L.divIcon({ className: '', html: el, iconSize: [0, 0] }) });
    const row = document.createElement('button');
    row.type = 'button'; row.className = 'row';
    row.innerHTML = `<span class="n">${n}</span>
      <span class="t"><div class="name">${esc(p.name)}</div><div class="meta">${p.first ? fmt(p.first) : ''}${p.name !== p.area ? ' · ' + esc(p.area) : ''}</div></span>
      ${p.pics && p.pics.length ? `<img class="thumb" alt="" src="${p.pics[0]}">` : '<span></span>'}`;
    const it = { p, n, el, marker, row, t: p.first ? day(p.first) : 0 };
    marker.on('click', () => open(it, false));
    row.addEventListener('click', () => open(it, true));
    list.appendChild(row);
    return it;
  });

  function deselect() {
    if (!active) return;
    active.el.classList.remove('on'); active.row.removeAttribute('aria-current'); active = null;
  }
  function open(it, fly) {
    deselect();
    active = it; it.el.classList.add('on'); it.row.setAttribute('aria-current', 'true');
    const z = Math.max(map.getZoom(), 15);
    if (matchMedia('(max-width: 760px)').matches) {
      // phone: the postcard covers the top of the map, so put the pin in the lower part
      const pt = map.project([it.p.lat, it.p.lon], z).subtract([0, map.getSize().y * 0.32]);
      map.flyTo(map.unproject(pt, z), z, { duration: 0.7 });
    } else if (fly) map.flyTo([it.p.lat, it.p.lon], z, { duration: 0.7 });
    renderCard(it);
  }

  function renderCard({ p, n }) {
    const pics = p.pics || [];
    let k = 0;
    const visits = p.days > 1 ? `Back here on ${p.days} different days` : 'One visit so far';
    card.innerHTML = `
      <button class="close" type="button" aria-label="Close postcard">×</button>
      <div class="photo ${pics.length ? '' : 'nophoto'}">
        ${pics.length ? `<img alt="Photo at ${esc(p.name)}" src="${pics[0]}">
          ${pics.length > 1 ? `<span class="count">1 / ${pics.length}</span>
          <div class="nav"><button type="button" data-d="-1" aria-label="Previous photo">‹</button><button type="button" data-d="1" aria-label="Next photo">›</button></div>` : ''}`
        : 'No photo for this one'}
      </div>
      <div class="body">
        <h2>${n}. ${esc(p.name)}</h2>
        <div class="postmark"><div>Boston MA<b>${p.first ? fmt(p.first).toUpperCase() : ''}</b>${p.first ? p.first.slice(0, 4) : ''}</div></div>
        <div class="where">${esc(p.area)}</div>
        <div class="facts">First found ${p.first ? fmt(p.first, { weekday: 'long', month: 'long', day: 'numeric' }) : 'on an unknown date'}. ${visits}.</div>
      </div>`;
    card.hidden = false;
    card.querySelector('.close').onclick = () => { card.hidden = true; deselect(); };
    card.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
      k = (k + +b.dataset.d + pics.length) % pics.length;
      card.querySelector('.photo img').src = pics[k];
      card.querySelector('.count').textContent = `${k + 1} / ${pics.length}`;
    });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !card.hidden) card.querySelector('.close').click(); });

  // fit to the places, with some breathing room
  const bounds = items.length ? L.latLngBounds(items.map(i => [i.p.lat, i.p.lon])) : L.latLngBounds([[42.33, -71.12], [42.37, -71.03]]);
  map.fitBounds(bounds.pad(0.3), { maxZoom: 15 });
  syncLabels();

  // ---------- timeline
  const t0 = meta.from ? day(meta.from) : 0, t1 = meta.to ? day(meta.to) : 0;
  const nDays = Math.max(0, Math.round((t1 - t0) / DAY));
  const slider = document.getElementById('slider'), when = document.getElementById('when');
  slider.max = nDays; slider.value = nDays;
  function show(d, animate) {
    const cut = t0 + d * DAY; let count = 0;
    items.forEach(it => {
      const on = it.t <= cut, was = map.hasLayer(it.marker);
      if (on) { count++; if (!was) { it.marker.addTo(map); if (animate) { it.el.classList.remove('pop'); void it.el.offsetWidth; it.el.classList.add('pop'); } } }
      else if (was) { it.marker.remove(); if (active === it) { card.hidden = true; deselect(); } }
      it.row.hidden = !on;
    });
    document.getElementById('sPlaces').textContent = count;
    when.textContent = t0 ? fmt(cut) : '';
  }
  slider.addEventListener('input', () => show(+slider.value, true));
  show(nDays, false);

  let timer = null;
  const play = document.getElementById('play');
  const stop = () => { clearInterval(timer); timer = null; play.textContent = '▶ Replay'; };
  play.addEventListener('click', () => {
    if (timer) return stop();
    card.hidden = true; deselect(); slider.value = 0; show(0, true); play.textContent = '❚❚ Pause';
    timer = setInterval(() => {
      if (+slider.value >= nDays) return stop();
      slider.value = +slider.value + 1; show(+slider.value, true);
    }, Math.max(70, 7000 / Math.max(1, nDays)));
  });
})();
</script>
<!--BUNDLE:END-->
</body>
</html>
